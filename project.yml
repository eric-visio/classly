# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Classly
options:
  bundleIdPrefix: com.visiocapital
  deploymentTarget:
    iOS: "17.0"
# Project-wide version + build, inherited by the app AND the extension so their
# versions always match (App Store Connect rejects an appex whose version differs
# from the app). Bump CURRENT_PROJECT_VERSION for every TestFlight upload.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only — avoids the iPad multitasking orientation requirement at upload.
    TARGETED_DEVICE_FAMILY: "1"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
targets:
  Classly:
    type: application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visiocapital.classly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SwiftSoup
      - target: ClassroomExtension
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Classly
        # Classly uses only standard HTTPS encryption, which is exempt — declaring this
        # skips the export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Lock the app so only you can see your kids' school data.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.visiocapital.classly.refresh
        CFBundleURLTypes:
          # Return scheme: the Safari extension bounces back here after importing.
          - CFBundleURLName: com.visiocapital.classly
            CFBundleURLSchemes: [classly]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Sources/Classly.entitlements
      properties:
        com.apple.security.application-groups: [group.com.visiocapital.classly]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.visiocapital.classly"]
  ClassroomExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Classroom/ClassroomWebSnapshot.swift
      - path: ClassroomExtension/SafariWebExtensionHandler.swift
      - path: ClassroomExtension/Resources
        type: group
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visiocapital.classly.classroom
    info:
      path: ClassroomExtension/Info.plist
      properties:
        CFBundleDisplayName: Classly Classroom
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: ClassroomExtension/ClassroomExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.visiocapital.classly]
  ClasslyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Classly
